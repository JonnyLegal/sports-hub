<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jon’s Sports Hub</title>
<meta name="theme-color" content="#241773">
<link rel="preload" href="fonts/barlow-condensed-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Styles follow the Sports Hub design system: Barlow Condensed / Barlow, square corners,
     and a three-tone angled card head (primary | shade band | secondary record block). */
  @font-face { font-family: "Barlow Condensed"; src: url("fonts/barlow-condensed-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: swap; }
  @font-face { font-family: "Barlow Condensed"; src: url("fonts/barlow-condensed-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: swap; }
  @font-face { font-family: "Barlow Condensed"; src: url("fonts/barlow-condensed-latin-800-normal.woff2") format("woff2"); font-weight: 800; font-style: normal; font-display: swap; }
  @font-face { font-family: "Barlow"; src: url("fonts/barlow-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: "Barlow"; src: url("fonts/barlow-latin-500-normal.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }
  @font-face { font-family: "Barlow"; src: url("fonts/barlow-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: swap; }
  :root {
    --bg: #f3f4f6;
    --card: #ffffff;
    --ink: #111827;
    --muted: #6b7280;
    --line: #e5e7eb;
    --win: #15803d;
    --loss: #b91c1c;
    --live: #dc2626;
    --badge-ink: #ffffff;
    --link: #1d4ed8;
    --logo-tile: #ffffff;
    --cut-slant: 20px;
    --cut-shade: 16px;
    --size-head-min: 76px;
    --radius-square: 0px;
    --shadow-card: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.05);
    --font-display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
    --font-text: "Barlow", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0f17;
      --card: #151b26;
      --ink: #f3f4f6;
      --muted: #9ca3af;
      --line: #263042;
      --win: #4ade80;
      --loss: #f87171;
      --live: #f87171;
      --badge-ink: #0b0f17;
      --link: #93c5fd;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.4 var(--font-text);
    -webkit-font-smoothing: antialiased;
  }
  header {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 16px 8px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  h1 { margin: 0; font: 800 2.25rem/1 var(--font-display); text-transform: uppercase; }
  #updated { color: var(--muted); font-size: 0.85rem; font-weight: 500; }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 8px 16px 32px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr));
    gap: 16px;
  }
  .card {
    container-type: inline-size;
    background: var(--card);
    border-radius: var(--radius-square);
    overflow: hidden;
    box-shadow: var(--shadow-card);
  }
  .card-head {
    background: var(--primary);
    color: var(--on-primary);
    padding: 0 0 0 16px;
    min-height: var(--size-head-min);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo {
    width: 48px; height: 48px;
    flex: none;
    display: grid;
    place-items: center;
    background: var(--logo-tile);
    border-radius: var(--radius-square);
  }
  .logo img { width: 30px; height: 30px; object-fit: contain; }
  .title { flex: 1; min-width: 0; padding: 14px 0; }
  /* Team names are one size on every card and never wrap: use the team's header name
     (20 characters at most, see the README), so it fits at full size. */
  .title h2 {
    margin: 0;
    font: 800 1.5rem/1.05 var(--font-display);
    letter-spacing: 0.01em;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .title .standing { margin-top: 2px; font-size: 0.85rem; font-weight: 500; line-height: 1.3; opacity: 0.85; }
  /* The record block: secondary fill, its left edge cut on a slant (cut-slant), with a
     primary-shade band (cut-shade wide) running along the cut between it and the primary. */
  .record {
    position: relative;
    align-self: stretch;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-end;
    padding: 14px 16px 14px calc(var(--cut-slant) + var(--cut-shade) + 16px);
    background: var(--secondary);
    color: var(--on-secondary);
    clip-path: polygon(var(--cut-slant) 0, 100% 0, 100% 100%, 0 100%);
    font: 800 2.25rem/1 var(--font-display);
    font-variant-numeric: tabular-nums;
  }
  .record small {
    display: block;
    margin-top: 2px;
    font: 700 0.75rem/1.2 var(--font-display);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    text-align: right;
  }
  .record::before {
    content: "";
    position: absolute;
    top: 0; bottom: 0; left: 0;
    width: calc(var(--cut-slant) + var(--cut-shade));
    background: var(--primary-shade);
    clip-path: polygon(var(--cut-slant) 0, 100% 0, var(--cut-shade) 100%, 0 100%);
  }
  /* Phone-width cards: every head steps down together, so names stay one size across cards. */
  @container (max-width: 440px) {
    .card-head { gap: 10px; padding-left: 12px; }
    .logo { width: 40px; height: 40px; }
    .logo img { width: 26px; height: 26px; }
    .title h2 { font-size: 1.15rem; }
    .record { font-size: 1.6rem; padding-right: 12px; }
  }
  .section { padding: 12px 16px; border-top: 1px solid var(--line); }
  .section:first-of-type { border-top: 0; }
  .label {
    font: 700 0.85rem/1.2 var(--font-display);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .label.live { color: var(--live); }
  .label.live::before {
    content: "";
    width: 8px; height: 8px;
    border-radius: var(--radius-square);
    background: var(--live);
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse { 50% { opacity: .3; } }
  .game { display: flex; align-items: center; gap: 10px; }
  .opp-logo { width: 28px; height: 28px; object-fit: contain; flex: none; }
  .game .info { flex: 1; min-width: 0; }
  .opp { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { font-size: 0.85rem; color: var(--muted); }
  .score { font: 800 1.5rem/1.1 var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .badge {
    display: inline-block;
    min-width: 1.6em;
    text-align: center;
    border-radius: var(--radius-square);
    padding: 1px 6px;
    margin-right: 6px;
    vertical-align: 2px;
    color: var(--badge-ink);
    font-size: 0.95rem;
    line-height: 1.2;
  }
  .W { background: var(--win); }
  .L { background: var(--loss); }
  .T, .D { background: var(--muted); }
  .empty { color: var(--muted); font-size: 0.9rem; }
  .cal {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .cal a, .follow { color: var(--link); font-weight: 600; text-decoration: none; }
  .follow { display: inline-block; margin: 6px 0 0 38px; font-size: 0.85rem; }
  .cal a:hover { text-decoration: underline; }
  .stale { color: var(--muted); font-size: 0.75rem; padding: 0 16px 10px; }
  #error { max-width: 1100px; margin: 0 auto; padding: 0 16px; color: var(--loss); }
  footer { text-align: center; color: var(--muted); font-size: 0.75rem; padding: 0 16px 24px; }
</style>
</head>
<body>
<header>
  <h1>Jon’s Sports Hub</h1>
  <div id="updated"></div>
</header>
<div id="error"></div>
<main id="teams"></main>
<footer>Data from ESPN and MLB Stats API · refreshes hourly</footer>

<script>
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function fmtDate(iso, withTime = true, tbd = false) {
  let d = new Date(iso);
  // TBD games carry a placeholder time (midnight Eastern), which would land on
  // the previous day out west. Use the Eastern calendar date instead.
  if (tbd) {
    const [y, m, dd] = d.toLocaleDateString("en-CA", { timeZone: "America/New_York" }).split("-").map(Number);
    d = new Date(y, m - 1, dd, 12);
  }
  const now = new Date();
  const day = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.round((day - today) / 86400000);
  let date;
  if (diff === 0) date = "Today";
  else if (diff === 1) date = "Tomorrow";
  else if (diff === -1) date = "Yesterday";
  else date = d.toLocaleDateString(undefined, {
    weekday: "short", month: "short", day: "numeric",
    year: d.getFullYear() !== now.getFullYear() ? "numeric" : undefined,
  });
  if (!withTime) return date;
  if (tbd) return `${date} · Time TBD`;
  const t = d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit", timeZoneName: "short" });
  return `${date} · ${t}`;
}

function ago(iso) {
  const mins = Math.round((Date.now() - new Date(iso)) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins} min ago`;
  const hrs = Math.round(mins / 60);
  if (hrs < 48) return `${hrs} hr${hrs === 1 ? "" : "s"} ago`;
  return `${Math.round(hrs / 24)} days ago`;
}

const vs = (g) => (g.neutral ? "vs" : g.homeAway === "home" ? "vs" : "@");

function oppLogo(g) {
  return g.opponentLogo
    ? `<img class="opp-logo" src="${esc(g.opponentLogo)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`
    : `<span class="opp-logo"></span>`;
}

function asOf(iso) {
  return new Date(iso).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}

function follow(g) {
  return g.gameUrl ? `<a class="follow" href="${esc(g.gameUrl)}" target="_blank" rel="noopener">Follow live ↗</a>` : "";
}

// kind "live" rows show the game clock only when it's fresh (polled just now);
// an hourly snapshot gets "Score as of <time>" instead of a stale clock.
function gameRow(g, kind, fresh = false) {
  const meta = [];
  if (kind === "last") meta.push(fmtDate(g.date, false, g.timeTBD));
  if (kind === "next") meta.push(fmtDate(g.date, true, g.timeTBD));
  if (kind === "live") {
    meta.push(fresh ? g.detail || "In progress" : g.teamScore != null ? `Score as of ${asOf(DATA.updated)}` : "In progress");
  }
  if (kind === "next" && g.broadcast) meta.push(g.broadcast);
  if (kind !== "last" && g.venue) meta.push(g.venue);
  if (g.note) meta.push(g.note);

  let right = "";
  if (kind === "last" && g.teamScore != null) {
    right = `<div class="score">${g.result ? `<span class="badge ${esc(g.result)}">${esc(g.result)}</span>` : ""}${g.teamScore}–${g.oppScore}</div>`;
  } else if (kind === "live" && g.teamScore != null) {
    right = `<div class="score">${g.teamScore}–${g.oppScore}</div>`;
  }
  return `
    <div class="game">
      ${oppLogo(g)}
      <div class="info">
        <div class="opp">${vs(g)} ${esc(g.opponent)}</div>
        <div class="meta">${meta.map(esc).join(" · ")}</div>
      </div>
      ${right}
    </div>`;
}

function calRow(t) {
  const https = new URL(t.calendar, location.href).href;
  const webcal = https.replace(/^https?:/, "webcal:");
  const google = `https://calendar.google.com/calendar/render?cid=${encodeURIComponent(webcal)}`;
  return `
      <div class="section cal">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M7 2h2v2h6V2h2v2h3a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3V2Zm12 8H5v9h14v-9ZM5 8h14V6H5v2Z"/></svg>
        <a href="${esc(webcal)}">Subscribe</a>
        <a href="${esc(google)}" target="_blank" rel="noopener">Google Calendar</a>
        <a href="${esc(https)}" download>.ics</a>
      </div>`;
}

function card(t) {
  const c = t.colors;
  const style = `--primary:${c.primary};--primary-shade:${c.shade || c.primary};--secondary:${c.secondary};--on-primary:${c.text};--on-secondary:${c.onSecondary || c.text}`;
  // Merge a live poll (if any) over the hourly snapshot.
  const L = LIVE[t.key];
  const polled = L && [t.live, t.next].find((g) => g && g.id === L.id);
  const liveGame = L && L.state === "in" && polled ? { ...polled, ...L }
    : t.live && !(L && L.state === "post" && L.id === t.live.id) ? t.live : null;
  const fresh = !!(liveGame && L && L.state === "in");
  const finished = L && L.state === "post" && polled ? { ...polled, ...L } : null;
  const last = finished || t.last;
  const shown = [liveGame, finished].filter(Boolean).map((g) => g.id);
  const next = t.next && !shown.includes(t.next.id) ? t.next : null;
  // Past its start but no live score (poll failed or not started): offer the game page.
  const started = next && !next.timeTBD && Date.now() >= Date.parse(next.date);

  const sections = [];
  if (liveGame) sections.push(`<div class="section"><div class="label live">Live</div>${
    gameRow(liveGame, "live", fresh)}${follow(liveGame)}</div>`);
  sections.push(`<div class="section"><div class="label">Last game</div>${
    last ? gameRow(last, "last") : `<div class="empty">No recent games</div>`}</div>`);
  if (next || !(liveGame || finished)) sections.push(`<div class="section"><div class="label">Next game</div>${
    next ? gameRow(next, "next") + (started ? follow(next) : "") : `<div class="empty">Not scheduled yet</div>`}</div>`);

  return `
    <article class="card" style="${style}">
      <div class="card-head">
        <span class="logo"><img src="${esc(t.logo)}" alt="" onerror="this.style.visibility='hidden'"></span>
        <div class="title">
          <h2>${esc(t.headerName || t.name)}</h2>
          ${t.standing ? `<div class="standing">${esc(t.standing)}</div>` : ""}
        </div>
        <div class="record">${esc(t.record || "–")}${t.recordNote ? `<small>${esc(t.recordNote)}</small>` : ""}</div>
      </div>
      ${sections.join("")}
      ${t.calendar ? calRow(t) : ""}
      ${t.stale ? `<div class="stale">Couldn't refresh this team on the last run; showing earlier data.</div>` : ""}
      ${t.error ? `<div class="stale">Data unavailable: ${esc(t.error)}</div>` : ""}
    </article>`;
}

// Soonest game first: teams playing now, then by next game time, then teams
// with nothing scheduled. A TBD game counts as the end of its day, so it
// sorts after a timed game on the same date. Ties keep data.json's order.
function nextGameKey(t) {
  if (t.live || (LIVE[t.key] && LIVE[t.key].state === "in")) return -Infinity;
  if (!t.next || !t.next.date) return Infinity;
  const ms = Date.parse(t.next.date);
  if (Number.isNaN(ms)) return Infinity;
  return t.next.timeTBD ? ms + 86400000 - 1 : ms;
}
function byNextGame(teams) {
  // Compare rather than subtract: Infinity - Infinity is NaN.
  return [...teams].sort((a, b) => {
    const ka = nextGameKey(a), kb = nextGameKey(b);
    return ka < kb ? -1 : ka > kb ? 1 : 0;
  });
}

// ---- Live scores --------------------------------------------------------
// data.json refreshes hourly, so during a game the page polls that one game's
// scoreboard itself (ESPN and MLB both allow cross-origin GETs). Plain fetch()
// with no custom headers: a CORS preflight would be refused.
let DATA = null;
const LIVE = {};    // team key -> { id, state, detail, teamScore, oppScore, result }
const timers = {};
const POLL_MS = 30000;

// The game to poll: the snapshot's live game, or the next game from 10 min
// before its start to 6 h after (it may have started since the last refresh).
function pollTarget(t) {
  if (t.live && t.live.liveUrl) return t.live;
  const g = t.next;
  if (!g || !g.liveUrl || g.timeTBD) return null;
  const start = Date.parse(g.date), now = Date.now();
  return now >= start - 10 * 60000 && now <= start + 6 * 3600000 ? g : null;
}

function parseLive(g, d) {
  const side = g.homeAway === "away" ? "away" : "home";
  if (d.dates) {  // MLB schedule?gamePk=
    const m = d.dates[0].games[0], ls = m.linescore || {};
    const us = m.teams[side], them = m.teams[side === "home" ? "away" : "home"];
    const st = m.status || {};
    let state = { Preview: "pre", Live: "in", Final: "post" }[st.abstractGameState] || "pre";
    if (["Postponed", "Cancelled", "Suspended"].includes(st.detailedState)) state = "canceled";
    const detail = state === "in" && ls.currentInningOrdinal
      ? `${ls.inningHalf || ""} ${ls.currentInningOrdinal}`.trim() : st.detailedState;
    const result = state === "post" ? (us.isWinner ? "W" : them.isWinner ? "L" : null) : null;
    return { id: g.id, state, detail, teamScore: us.score ?? null, oppScore: them.score ?? null, result };
  }
  const c = d.competitions[0], st = c.status.type;  // ESPN scoreboard/{id}
  const us = c.competitors.find((x) => x.homeAway === side);
  const them = c.competitors.find((x) => x !== us);
  const num = (x) => (x && x.score != null && x.score !== "" ? Number(x.score) : null);
  let state = st.state;
  if (["STATUS_POSTPONED", "STATUS_CANCELED"].includes(st.name)) state = "canceled";
  let result = null;
  if (state === "post") {
    result = us.winner ? "W" : them.winner ? "L" : g.liveUrl.includes("/soccer/") ? "D" : "T";
  }
  return { id: g.id, state, detail: st.shortDetail || st.detail, teamScore: num(us), oppScore: num(them), result };
}

async function poll(key) {
  delete timers[key];
  const t = DATA.teams.find((x) => x.key === key);
  const g = t && pollTarget(t);
  if (!g) return;
  if (!document.hidden) {
    try {
      const res = await fetch(g.liveUrl);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      LIVE[key] = parseLive(g, await res.json());
    } catch (e) {
      delete LIVE[key];  // fall back to the hourly snapshot, labelled "as of"
    }
    render();
  }
  const L = LIVE[key];
  if (!(L && ["post", "canceled"].includes(L.state))) timers[key] = setTimeout(() => poll(key), POLL_MS);
}

function startPolling() {
  for (const t of DATA.teams) if (!timers[t.key] && pollTarget(t) && !(LIVE[t.key] && LIVE[t.key].state === "post")) poll(t.key);
}

function render() {
  document.getElementById("teams").innerHTML = byNextGame(DATA.teams).map(card).join("");
  const u = document.getElementById("updated");
  u.textContent = `Updated ${ago(DATA.updated)}`;
  u.title = new Date(DATA.updated).toLocaleString();
}

async function load() {
  try {
    const res = await fetch(`data.json?t=${Date.now()}`, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    // A newer snapshot that already has the result supersedes a "post" poll.
    if (DATA && data.updated !== DATA.updated) for (const k in LIVE) if (LIVE[k].state !== "in") delete LIVE[k];
    DATA = data;
    document.getElementById("error").textContent = "";
    render();
    startPolling();
  } catch (e) {
    if (!DATA) document.getElementById("error").textContent = `Couldn't load data.json (${e.message}).`;
  }
}
load();
setInterval(load, 5 * 60000);          // pick up the hourly refresh without a reload
setInterval(() => DATA && startPolling(), 60000);  // catch games that start while open
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && DATA) { for (const k in timers) { clearTimeout(timers[k]); delete timers[k]; } startPolling(); }
});
</script>
</body>
</html>
